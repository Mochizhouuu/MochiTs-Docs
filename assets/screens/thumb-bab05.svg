<svg xmlns="http://www.w3.org/2000/svg" width="144" height="144" viewBox="0 0 144 144" role="img" aria-label="Ilustrasi tester Script TL: naskah di kiri, hasil penguraian di kanan">
  <!-- Mini tester: dua kolom, naskah dan hasil, bergaya panel aplikasi gelap -->
  <rect width="144" height="144" fill="#0f141d"></rect>
  <g transform="rotate(-1.2 72 72)">
    <rect x="9" y="14" width="58" height="116" rx="9" fill="#151c27" stroke="#263243"></rect>
    <rect x="77" y="14" width="58" height="116" rx="9" fill="#151c27" stroke="#263243"></rect>
    <!-- label P1 -->
    <rect x="15" y="20" width="21" height="10" rx="3" fill="#0a6ef0"></rect>
    <!-- simbol -->
    <g font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#a9c7ff">
      <text x="15" y="44">[]</text>
      <text x="15" y="62">-</text>
      <text x="15" y="80">#</text>
      <text x="15" y="98">**</text>
    </g>
    <!-- baris teks naskah -->
    <g stroke="#46536a" stroke-width="2.5" stroke-linecap="round">
      <path d="M32 40h28"></path>
      <path d="M24 58h36"></path>
      <path d="M24 76h22"></path>
      <path d="M32 94h30"></path>
    </g>
    <!-- hasil kanan -->
    <rect x="83" y="22" width="24" height="9" rx="2.5" fill="#1c2532" stroke="#2c3a4e"></rect>
    <g fill="#e5ecf6">
      <rect x="83" y="40" width="46" height="6" rx="3"></rect>
      <rect x="83" y="56" width="34" height="6" rx="3"></rect>
      <rect x="83" y="72" width="42" height="6" rx="3"></rect>
      <rect x="83" y="88" width="30" height="6" rx="3"></rect>
    </g>
    <rect x="83" y="102" width="16" height="10" rx="3" fill="#0a6ef0" opacity=".85"></rect>
    <rect x="103" y="102" width="20" height="10" rx="3" fill="#1c2532" stroke="#2c3a4e"></rect>
  </g>
</svg>
